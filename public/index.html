<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>CoTa Warehouse</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="CoTa">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Icons, referenced with <use href="#i-…"> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="12" width="7.5" height="7.5" rx="1"/><rect x="13" y="12" width="7.5" height="7.5" rx="1"/><rect x="8.25" y="3.5" width="7.5" height="7.5" rx="1"/></g></symbol>
    <symbol id="i-inventory" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></g></symbol>
    <symbol id="i-refill" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 20V10M19 20V10M3 10h18"/><path d="M12 3v10M8.5 6.5L12 3l3.5 3.5"/></g></symbol>
    <symbol id="i-pick" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h11M10 12h11M10 18h11"/><path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></g></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></g></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></g></symbol>
  </svg>

  <div class="app">
    <!-- Desktop sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-mark"><svg><use href="#i-logo"/></svg></span>
        <span><b>CoTa</b><small>Warehouse</small></span>
      </div>
      <nav class="nav" aria-label="Sections">
        <a href="#/inventory" data-view="inventory"><svg><use href="#i-inventory"/></svg><span>Inventory</span></a>
        <a href="#/refill" data-view="refill"><svg><use href="#i-refill"/></svg><span>Shelf refill</span></a>
        <a href="#/picklist" data-view="picklist"><svg><use href="#i-pick"/></svg><span>Pick list</span></a>
      </nav>
      <div class="sidebar-foot"><span class="conn"><i></i><span class="conn-label">Online</span></span></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <span class="logo-mark mobile-only"><svg><use href="#i-logo"/></svg></span>
        <div class="titles">
          <h1 id="page-title">Inventory</h1>
          <p id="page-sub"></p>
        </div>
        <span class="conn mobile-only"><i></i></span>
      </header>

      <div class="content">
        <!-- Part 1: inventory search -->
        <section class="view" data-view="inventory">
          <form id="search-form" class="toolbar" role="search" autocomplete="off">
            <label class="search">
              <svg><use href="#i-search"/></svg>
              <input id="q" type="search" placeholder="Search by SKU or product name" aria-label="Search by SKU or product name" enterkeyhint="search">
            </label>
          </form>
          <div id="inv-stats" class="stats"></div>
          <div class="panel">
            <div class="panel-head"><h2>Stock by product</h2><span id="inv-count" class="muted"></span></div>
            <div id="inv-table" aria-live="polite"></div>
          </div>
        </section>

        <!-- Part 2: open-shelf replenishment -->
        <section class="view split" data-view="refill" hidden>
          <div class="panel">
            <div class="panel-head"><h2>Shelf details</h2></div>
            <form id="refill-form" class="panel-body form" autocomplete="off">
              <div class="field">
                <label for="refill-sku">Product</label>
                <select id="refill-sku" required></select>
              </div>
              <div class="field-row">
                <div class="field">
                  <label for="capacity">Shelf capacity</label>
                  <div class="suffix"><input id="capacity" type="number" inputmode="numeric" min="1" step="1" required><span>units</span></div>
                </div>
                <div class="field">
                  <label for="current">On shelf now</label>
                  <div class="suffix"><input id="current" type="number" inputmode="numeric" min="0" step="1" required><span>units</span></div>
                </div>
              </div>
              <div id="refill-storage" class="storage-mini"></div>
            </form>
          </div>
          <div class="panel">
            <div class="panel-head"><h2>What to pull</h2></div>
            <div id="refill-result" class="panel-body" aria-live="polite"></div>
          </div>
        </section>

        <!-- Part 3: pick list -->
        <section class="view split" data-view="picklist" hidden>
          <div class="panel">
            <div class="panel-head">
              <h2>Order</h2>
              <button type="button" id="load-example" class="btn ghost sm">Load example</button>
            </div>
            <form id="pick-form" class="panel-body form" autocomplete="off">
              <div class="pick-head"><span>SKU</span><span>Cases</span><span></span></div>
              <div id="pick-lines" class="pick-lines"></div>
              <button type="button" id="add-line" class="btn ghost add"><svg><use href="#i-plus"/></svg>Add line</button>
              <button type="submit" class="btn primary block">Build pick list</button>
            </form>
          </div>
          <div class="panel">
            <div class="panel-head">
              <h2>Pick route</h2>
              <button type="button" id="print" class="btn ghost sm" hidden><svg><use href="#i-print"/></svg>Print</button>
            </div>
            <div id="pick-result" class="panel-body" aria-live="polite"></div>
          </div>
        </section>
      </div>
    </div>

    <!-- Mobile tab bar -->
    <nav class="tabbar" aria-label="Sections">
      <a href="#/inventory" data-view="inventory"><svg><use href="#i-inventory"/></svg><span>Inventory</span></a>
      <a href="#/refill" data-view="refill"><svg><use href="#i-refill"/></svg><span>Refill</span></a>
      <a href="#/picklist" data-view="picklist"><svg><use href="#i-pick"/></svg><span>Pick list</span></a>
    </nav>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
